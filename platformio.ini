; Файл конфигурации проекта PlatformIO
;
;   Параметры сборки: флаги компиляции, фильтр исходников
;   Параметры загрузки: порт, скорость и дополнительные флаги
;   Параметры библиотек: зависимости и дополнительные каталоги
;   Расширенные параметры: дополнительные скрипты
;
; Остальные параметры и примеры приведены в документации
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

board_build.filesystem = spiffs
board_build.flash_mode = dio
board_build.partitions = partitions.csv

lib_deps =
    nrf24/RF24 @ ^1.6.2
    https://github.com/pschatzmann/codec-helix/archive/f6e55a307c7577c5e3dfe1bf424a61075235fa08.zip

build_flags =
    ; Сохранять размер стека loop, проверенный при воспроизведении аудио.
    -D ARDUINO_LOOP_STACK_SIZE=16384
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
